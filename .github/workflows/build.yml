name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Build APK
        working-directory: android
        run: |
          yes | "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -1)" --licenses > /dev/null || true
          ./gradlew assembleRelease --no-daemon
      - name: Package KOReader plugin
        run: cd koreader && zip -r ../pageflip.koplugin.zip pageflip.koplugin
      - uses: actions/upload-artifact@v5
        with:
          name: PageFlip
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            pageflip.koplugin.zip
